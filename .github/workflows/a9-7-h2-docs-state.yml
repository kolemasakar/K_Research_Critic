name: A9.7-H2 Facebook Documentation State

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/a9_7_h2_docs_patch.py
      - .github/workflows/a9-7-h2-docs-state.yml

permissions:
  contents: write

concurrency:
  group: a9-7-h2-facebook-doc-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/video-url-research
          fetch-depth: 0

      - name: Apply A9.7-H2 documentation state
        run: python .github/scripts/a9_7_h2_docs_patch.py

      - name: Guard scope and commit
        run: |
          set -euo pipefail
          allowed='^(gpt_store/media_beta_manifest.yaml|scripts/validate_store_package.py|tests/test_media_beta_managed_package.py|subprojects/media_beta/00_INDEX.md|subprojects/media_beta/03_CURRENT_STATE.md|subprojects/media_beta/41_A9_7_FACEBOOK_COBALT_LIVE_ACCEPTANCE.md)$'
          changed="$(git status --short | awk '{print $2}')"
          test -n "$changed"
          while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || { echo "unexpected path: $path"; exit 1; }
          done <<< "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gpt_store/media_beta_manifest.yaml \
            scripts/validate_store_package.py \
            tests/test_media_beta_managed_package.py \
            subprojects/media_beta/00_INDEX.md \
            subprojects/media_beta/03_CURRENT_STATE.md \
            subprojects/media_beta/41_A9_7_FACEBOOK_COBALT_LIVE_ACCEPTANCE.md
          git commit -m 'A9.7-H2 record Facebook Cobalt live acceptance'
          git push origin HEAD:agent/video-url-research
