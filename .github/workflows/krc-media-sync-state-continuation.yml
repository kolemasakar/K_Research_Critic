name: KRC MEDIA Sync State Continuation Acceptance
on:
  push:
    branches:
      - agent/video-url-research
    paths:
      - .github/workflows/krc-media-sync-state-continuation.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical MEDIA BETA state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('subprojects/media_beta/03_CURRENT_STATE.md')
          s = p.read_text()
          replacements = [
            ('Version: 7.2', 'Version: 7.3'),
            ('AUTH_INPUT_REPLAY_NEGATIVE_MATRIX_ACCEPTED\nA10_COPY_SAFE_CLAIM_TABLE_RUNTIME_ACCEPTED', 'AUTH_INPUT_REPLAY_NEGATIVE_MATRIX_ACCEPTED\nSTATE_CONTINUATION_NEGATIVE_MATRIX_ACCEPTED\nA10_COPY_SAFE_CLAIM_TABLE_RUNTIME_ACCEPTED'),
            ('auth/input/replay acceptance-record head at 2026-08-29 sync: 4ef9784655c413625e364b9f6eb1a43f1d26b96d\ndraft PR: #28', 'auth/input/replay acceptance-record head at 2026-08-29 sync: 4ef9784655c413625e364b9f6eb1a43f1d26b96d\nstate/continuation implementation: 8da6011cbd8f1134f125266951eebaef894be31c\nstate/continuation acceptance record: docs/history/KRC_MEDIA_STATE_CONTINUATION_NEGATIVE_MATRIX_2026-08-29.md\ndraft PR: #28'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'canonical replacement missing or ambiguous: {old[:50]}')
              s = s.replace(old, new, 1)
          paragraph_old = 'The later auth/input/replay negative matrix is also accepted: Action bearer failures, malformed/oversized input, invalid methods/IDs/pagination, server-side owner admission, and duplicate replay boundaries were hardened or revalidated without a new provider-consuming media job. The owner continues private testing before release decisions.'
          paragraph_new = paragraph_old.replace(' The owner continues private testing before release decisions.', ' The later state/job-read/continuation matrix is also accepted: stale and interrupted job reads fail safely, non-completed jobs do not expose segments, AI and Facebook continuation paths enforce state/platform compatibility, and fresh native retries require a native FAILED target. The owner continues private testing before release decisions.')
          if s.count(paragraph_old) != 1:
              raise SystemExit('executive paragraph baseline not found')
          s = s.replace(paragraph_old, paragraph_new, 1)
          anchor = '## Research/Critic Invariants'
          section = '''## State / Job Read / Continuation Negative Matrix Acceptance

Accepted owner-testing record in VoiceBridge:

```text
docs/history/KRC_MEDIA_STATE_CONTINUATION_NEGATIVE_MATRIX_2026-08-29.md
```

Implementation and validation:
- VoiceBridge implementation commit `8da6011cbd8f1134f125266951eebaef894be31c`;
- missing and expired durable job IDs fail closed: PASS;
- orphan persisted `PROCESSING` is reconciled to `FAILED` without provider replay: PASS;
- segments are exposed only for `COMPLETED`: PASS;
- AI continuation rejects unsupported platform and wrong state before generated-provider work: PASS;
- Facebook retrieval continuation now independently requires a Facebook source URL in addition to provider mode/state: PASS;
- fresh native retry now independently requires the FAILED target to have `provider_mode=native`: PASS;
- full VoiceBridge cloud suite in accepted repair run `33261652699`: 146/146 PASS;
- isolated Render read-only unknown-job smoke run `33261788902`: SUCCESS;
- live unknown job/segment/AI/Facebook continuation preflight reads returned `404 / MEDIA_TRANSCRIPT_NOT_FOUND`: PASS;
- provider-consuming work during live smoke: NONE;
- Render environment mutation: NONE;
- Neon database mutation requested: NONE.

Harness-only failures before acceptance were confined to one invalid temporary workflow definition and one malformed regression fixture job ID; neither executed provider-consuming work or changed runtime/database state.

'''
          if s.count(anchor) != 1:
              raise SystemExit('Research/Critic anchor not found exactly once')
          s = s.replace(anchor, section + anchor, 1)
          p.write_text(s)
          PY
      - name: Commit state sync and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/krc-media-sync-state-continuation.yml
          git add subprojects/media_beta/03_CURRENT_STATE.md
          git commit -m "Sync MEDIA BETA state continuation acceptance"
          git push origin HEAD:agent/video-url-research
