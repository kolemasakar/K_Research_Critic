openapi: 3.1.0
info:
  title: K-Research & Critic Managed Media Beta API
  version: 0.2.2-a9.5
  description: >-
    Owner-only zero-client managed transcript beta. The GPT must call credit
    preflight first, show the user the available credits, estimated cost and
    estimated remaining balance, and wait for explicit user approval before
    starting a billable native transcript request. The Action bearer credential
    authenticates the private GPT; the owner beta admission code is injected
    server-side and is never requested from or exposed to the user. No automatic
    AI fallback is permitted.
servers:
  - url: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
paths:
  /api/v1/media/managed/preflight:
    post:
      operationId: preflightManagedMediaCredits
      summary: Read managed transcript credit balance and native cost estimate
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightRequest"
      responses:
        "200":
          description: Credit quote. This does not authorize transcript processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPreflight"
        "400":
          description: Invalid URL or language hint.
        "401":
          description: Private GPT Action authentication failed.
        "503":
          description: Managed transcript provider is not configured or unavailable.
  /api/v1/media/managed/transcriptions:
    post:
      operationId: startManagedMediaNativeTranscription
      summary: Spend at most one approved credit on a native managed transcript
      description: >-
        Call only after a successful credit preflight and the user's explicit
        approval. The request is capped at one Supadata native credit. If native
        captions are unavailable, return AWAITING_AI_CONSENT. Never start AI
        transcription automatically.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeTranscriptRequest"
      responses:
        "200":
          description: Native request completed, processing, failed, or stopped awaiting separate AI consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "400":
          description: Invalid request.
        "401":
          description: Private GPT Action authentication failed.
        "409":
          description: Explicit one-credit consent is missing or invalid.
        "429":
          description: Provider credits are exhausted or provider rate limit reached.
        "503":
          description: Managed transcript provider is not configured or unavailable.
  /api/v1/media/managed/transcriptions/{job_id}:
    get:
      operationId: getManagedMediaTranscriptionStatus
      summary: Read managed media job status and actual credit charge
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^KRCM_[A-Za-z0-9-]+$
      responses:
        "200":
          description: Current managed media job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "404":
          description: Job not found.
  /api/v1/media/managed/transcriptions/{job_id}/segments:
    get:
      operationId: getManagedMediaTranscriptSegments
      summary: Read timestamped transcript segments
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^KRCM_[A-Za-z0-9-]+$
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: Transcript segment page. Follow next_cursor until null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentPage"
        "404":
          description: Job not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PreflightRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Public HTTPS media URL. Current live-accepted adapter is YouTube.
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
          default: auto
    NativeTranscriptRequest:
      type: object
      additionalProperties: false
      required: [url, credit_consent]
      properties:
        url:
          type: string
          format: uri
          description: Public HTTPS media URL. Current live-accepted adapter is YouTube.
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
          default: auto
        credit_consent:
          type: object
          additionalProperties: false
          required: [provider, mode, max_credits]
          properties:
            provider:
              type: string
              const: supadata
            mode:
              type: string
              const: native
            max_credits:
              type: integer
              minimum: 1
              maximum: 1
              description: Hard user-approved maximum for this operation.
    CreditPreflight:
      type: object
      required:
        - provider
        - mode
        - plan
        - credits_available
        - estimated_credits
        - credits_after_estimate
        - can_continue
        - consent_required
        - consent_options
      properties:
        request_id:
          type: string
        source_url:
          type: string
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
        provider:
          type: string
          const: supadata
        mode:
          type: string
          const: native
        plan:
          type: string
        credits_available:
          type: number
          minimum: 0
        estimated_credits:
          type: integer
          const: 1
        credits_after_estimate:
          type: number
          minimum: 0
        can_continue:
          type: boolean
        consent_required:
          type: boolean
          const: true
        consent_options:
          type: object
          required: [approve, reject]
          properties:
            approve:
              type: integer
              const: 1
            reject:
              type: integer
              const: 2
    ManagedJob:
      type: object
      properties:
        request_id:
          type: string
        job_id:
          type: string
          pattern: ^KRCM_[A-Za-z0-9-]+$
        status:
          type: string
          enum: [PROCESSING, COMPLETED, AWAITING_AI_CONSENT, FAILED]
        created_at:
          type: string
        updated_at:
          type: string
        source_url:
          type: string
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
        provider:
          type: string
          const: supadata
        provider_mode:
          type: string
          const: native
        detected_language:
          anyOf:
            - type: string
            - type: "null"
        available_languages:
          type: array
          items:
            type: string
        credits_charged:
          type: number
          minimum: 0
        credits_remaining_estimate:
          type: number
          minimum: 0
        credit_charge_uncertain:
          type: boolean
        reused:
          type: boolean
        segment_count:
          type: integer
          minimum: 0
        transcript_characters:
          type: integer
          minimum: 0
        ai_fallback_requires_new_consent:
          type: boolean
          const: true
        error:
          anyOf:
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
                retryable:
                  type: boolean
            - type: "null"
    SegmentPage:
      type: object
      required: [job_id, status, cursor, next_cursor, segments]
      properties:
        request_id:
          type: string
        job_id:
          type: string
          pattern: ^KRCM_[A-Za-z0-9-]+$
        status:
          type: string
          enum: [PROCESSING, COMPLETED, AWAITING_AI_CONSENT, FAILED]
        cursor:
          type: integer
        next_cursor:
          anyOf:
            - type: integer
            - type: "null"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
    Segment:
      type: object
      required: [index, start_ms, end_ms, text, confidence]
      properties:
        index:
          type: integer
        start_ms:
          anyOf:
            - type: integer
            - type: "null"
        end_ms:
          anyOf:
            - type: integer
            - type: "null"
        text:
          type: string
        confidence:
          anyOf:
            - type: number
            - type: "null"
security:
  - bearerAuth: []
