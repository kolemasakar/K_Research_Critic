name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full pytest suite
        run: python -m pytest -q

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Dependency integrity
        run: python -m pip check

      - name: Ruff correctness lint
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Mypy typed boundary check
        run: python -m mypy models config gpt_store

      - name: Validate repository policy
        run: python -m scripts.validate_repository

      - name: Validate GPT Store package
        run: python -m scripts.validate_store_package

      - name: Run coverage gate
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70

  a9_7_c_schema_audit:
    name: A9.7-C media schema audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run A9.7-C package gates with diagnostics
        id: gate
        shell: bash
        run: |
          set +e
          python -m scripts.validate_repository > repository.log 2>&1
          repo_rc=$?
          python -m scripts.validate_store_package > store.log 2>&1
          store_rc=$?
          python -m pytest -q > pytest.log 2>&1
          pytest_rc=$?
          repo_diag="$(tail -n 1 repository.log | tr '\n' ' ' | cut -c1-220)"
          store_diag="$(tail -n 1 store.log | tr '\n' ' ' | cut -c1-220)"
          pytest_diag="$(tail -n 1 pytest.log | tr '\n' ' ' | cut -c1-220)"
          echo "repo_rc=$repo_rc" >> "$GITHUB_OUTPUT"
          echo "store_rc=$store_rc" >> "$GITHUB_OUTPUT"
          echo "pytest_rc=$pytest_rc" >> "$GITHUB_OUTPUT"
          echo "repo_diag=$repo_diag" >> "$GITHUB_OUTPUT"
          echo "store_diag=$store_diag" >> "$GITHUB_OUTPUT"
          echo "pytest_diag=$pytest_diag" >> "$GITHUB_OUTPUT"
          cat repository.log
          cat store.log
          cat pytest.log
          exit 0

      - name: Report A9.7-C gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_RC: ${{ steps.gate.outputs.repo_rc }}
          STORE_RC: ${{ steps.gate.outputs.store_rc }}
          PYTEST_RC: ${{ steps.gate.outputs.pytest_rc }}
          REPO_DIAG: ${{ steps.gate.outputs.repo_diag }}
          STORE_DIAG: ${{ steps.gate.outputs.store_diag }}
          PYTEST_DIAG: ${{ steps.gate.outputs.pytest_diag }}
        run: |
          if [[ "$REPO_RC" == "0" && "$STORE_RC" == "0" && "$PYTEST_RC" == "0" ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 8 --repo kolemasakar/K_Research_Critic --body "A9.7-C managed Facebook Action schema audit V2: **${result}**. validate_repository_rc=\`${REPO_RC}\`, validate_store_package_rc=\`${STORE_RC}\`, pytest_rc=\`${PYTEST_RC}\`; repository_diag=\`${REPO_DIAG}\`; store_diag=\`${STORE_DIAG}\`; pytest_diag=\`${PYTEST_DIAG}\`. No provider or Render endpoint is called by this CI gate. Production/main are not targeted."
          [[ "$result" == "PASS" ]]
