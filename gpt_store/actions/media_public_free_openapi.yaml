openapi: 3.1.0
info:
  title: K-Research & Critic Public MEDIA API
  version: 0.8.0-r2-gemini-youtube
  description: >-
    Candidate public MEDIA Action for supported public YouTube, Instagram,
    Facebook, and Telegram video URLs. YouTube uses Gemini Developer API Free
    Tier direct public-URL video processing only after explicit user consent to
    the Free Tier data-use boundary. Instagram and Facebook use self-hosted
    Cobalt followed by AssemblyAI universal-2 while free balance remains.
    Telegram uses the accepted public-web route followed by AssemblyAI.
    No paid retrieval, paid STT, user cookies, user login, or paid proxy fallback
    is exposed.
x-krc-release-state: R2_REPOSITORY_CANDIDATE_NOT_PUBLICLY_ACTIVATED
x-krc-free-tier-policy:
  paid_retrieval_fallback: false
  paid_stt_fallback: false
  paid_proxy_fallback: false
  supadata_public_active: false
  scrapecreators_public_active: false
  youtube_gemini_free_tier_only: true
servers:
  - url: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
security:
  - bearerAuth: []
paths:
  /api/v1/media/public-capabilities:
    get:
      operationId: getPublicMediaCapabilities
      summary: Read current public MEDIA routing and safety state
      x-openai-isConsequential: false
      responses:
        "200":
          description: Current public MEDIA capability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCapabilities"
        "401":
          description: Action bearer authentication failed.
        "503":
          description: Public MEDIA is not configured.

  /api/v1/media/youtube-gemini/preflight:
    post:
      operationId: preflightPublicGeminiYoutube
      summary: Check the Gemini Free direct YouTube route and disclosure
      description: >-
        Validate a public YouTube URL and return the Gemini Developer API Free
        Tier data-use disclosure. This does not call Gemini and does not process
        the video.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeRequest"
      responses:
        "200":
          description: YouTube Gemini Free preflight and consent requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiYoutubePreflight"
        "400":
          description: Invalid request.
        "401":
          description: Action bearer authentication failed.
        "422":
          description: Unsupported public YouTube URL.
        "503":
          description: Gemini Free direct YouTube route is not configured.

  /api/v1/media/youtube-gemini/lookup:
    post:
      operationId: lookupPublicGeminiYoutubeJob
      summary: Reuse an existing Gemini YouTube MEDIA job
      description: >-
        Look up durable state for the same public YouTube URL and language hint
        without making another Gemini request.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeRequest"
      responses:
        "200":
          description: Existing durable YouTube MEDIA job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "401":
          description: Action bearer authentication failed.
        "404":
          description: Matching MEDIA job was not found.
        "422":
          description: Unsupported public YouTube URL.
        "503":
          description: Durable state or Gemini route is unavailable.

  /api/v1/media/youtube-gemini/transcriptions:
    post:
      operationId: startPublicGeminiYoutubeTranscription
      summary: Process a public YouTube video directly with Gemini Free
      description: >-
        Send the public YouTube URL to Gemini Developer API Free Tier only after
        the user explicitly acknowledges that Free Tier content may be used by
        Google to improve Google products. No Cobalt, AssemblyAI, cookies, login,
        paid proxy, or paid Gemini fallback is used on this route.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeGeminiStartRequest"
      responses:
        "200":
          description: YouTube MEDIA job completed, failed closed, processing, or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "400":
          description: Invalid request.
        "401":
          description: Action bearer authentication failed.
        "409":
          description: Explicit Gemini Free data-use consent is missing.
        "422":
          description: Unsupported/unavailable public YouTube video or empty transcript.
        "429":
          description: Gemini Free provider quota or public admission limit is exhausted.
        "502":
          description: Gemini provider could not be reached safely.
        "503":
          description: Durable state or Gemini Free route is unavailable.

  /api/v1/media/youtube-gemini/transcriptions/{job_id}:
    get:
      operationId: getPublicGeminiYoutubeJob
      summary: Read durable Gemini YouTube MEDIA job status
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^KRCM_[A-Za-z0-9-]+$
      responses:
        "200":
          description: Current durable YouTube MEDIA job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "401":
          description: Action bearer authentication failed.
        "404":
          description: Job not found.
        "503":
          description: Durable MEDIA state is unavailable.

  /api/v1/media/youtube-gemini/transcriptions/{job_id}/segments:
    get:
      operationId: getPublicGeminiYoutubeSegments
      summary: Read transcript segments for a Gemini YouTube MEDIA job
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^KRCM_[A-Za-z0-9-]+$
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Transcript segment page. Follow next_cursor until null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentPage"
        "400":
          description: Invalid pagination.
        "401":
          description: Action bearer authentication failed.
        "404":
          description: Job not found.

  /api/v1/media/managed/preflight:
    post:
      operationId: preflightPublicInstagramCobalt
      summary: Check the Instagram Cobalt route before transcription
      description: >-
        Validate a supported public Instagram Reel/video URL and report the
        zero-credit Cobalt retrieval route. This does not start provider work.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstagramRequest"
      responses:
        "200":
          description: Instagram Cobalt retrieval/STT preflight.
        "401":
          description: Action bearer authentication failed.
        "422":
          description: Unsupported public Instagram URL.
        "503":
          description: Public Cobalt route is not configured.

  /api/v1/media/managed/lookup:
    post:
      operationId: lookupPublicInstagramCobaltJob
      summary: Reuse an existing Instagram MEDIA job
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstagramRequest"
      responses:
        "200":
          description: Existing durable Instagram MEDIA job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "404":
          description: Matching MEDIA job was not found.
        "503":
          description: Durable state or Cobalt route is unavailable.

  /api/v1/media/managed/transcriptions:
    post:
      operationId: startPublicInstagramCobaltTranscription
      summary: Retrieve and transcribe a public Instagram video
      description: >-
        Use self-hosted Cobalt audio retrieval and AssemblyAI universal-2 STT.
        Retrieval credits are zero. Cobalt failure is terminal and there is no
        Supadata or paid fallback.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstagramRequest"
      responses:
        "200":
          description: Instagram MEDIA job completed, failed closed, processing, or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "422":
          description: Unsupported URL or unusable media.
        "429":
          description: Project AssemblyAI safety quota is exhausted.
        "502":
          description: Retrieval or STT provider could not be reached safely.
        "503":
          description: Durable state or provider route is unavailable.

  /api/v1/media/managed/facebook-fallback:
    post:
      operationId: startPublicFacebookCobaltTranscription
      summary: Retrieve and transcribe a public Facebook video
      description: >-
        Use self-hosted Cobalt for supported public Facebook video/Reel media,
        followed by AssemblyAI STT. Cobalt failure is terminal; no paid fallback.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookRequest"
      responses:
        "200":
          description: Facebook MEDIA job completed, failed closed, or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "422":
          description: Unsupported or unavailable public Facebook media.
        "429":
          description: Project AssemblyAI safety quota is exhausted.
        "502":
          description: Retrieval or STT provider could not be reached safely.
        "503":
          description: Facebook route or durable state is unavailable.

  /api/v1/media/managed/telegram:
    post:
      operationId: startPublicTelegramTranscription
      summary: Retrieve and transcribe a public Telegram video
      description: >-
        Use the public Telegram web/media route with zero retrieval credits and no
        Telegram account, cookies, session, bot token, or paid fallback.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramRequest"
      responses:
        "200":
          description: Telegram MEDIA job completed, failed closed, or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "422":
          description: Public Telegram post or playable video is unavailable.
        "429":
          description: Project AssemblyAI safety quota is exhausted.
        "502":
          description: Retrieval or STT provider could not be reached safely.
        "503":
          description: Telegram route or durable state is unavailable.

  /api/v1/media/managed/transcriptions/{job_id}:
    get:
      operationId: getPublicNonYoutubeMediaJob
      summary: Read durable Instagram/Facebook/Telegram MEDIA job status
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^KRCM_[A-Za-z0-9-]+$
      responses:
        "200":
          description: Current durable MEDIA job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "404":
          description: Job not found.

  /api/v1/media/managed/transcriptions/{job_id}/segments:
    get:
      operationId: getPublicNonYoutubeMediaSegments
      summary: Read transcript segments for Instagram/Facebook/Telegram MEDIA
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^KRCM_[A-Za-z0-9-]+$
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Transcript segment page. Follow next_cursor until null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentPage"
        "404":
          description: Job not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    LanguageHint:
      type: string
      enum: [auto, uk, ru, en]
      default: auto

    YoutubeRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Supported public HTTPS YouTube URL. Private and unlisted videos are not supported.
        language_hint:
          $ref: "#/components/schemas/LanguageHint"

    GeminiFreeConsent:
      type: object
      additionalProperties: false
      required: [provider, tier, data_use_acknowledged]
      properties:
        provider:
          type: string
          const: google_gemini
        tier:
          type: string
          const: free
        data_use_acknowledged:
          type: boolean
          const: true
          description: >-
            True only after the user explicitly acknowledges that content sent
            through Gemini Developer API Free Tier may be used by Google to
            improve Google products.

    YoutubeGeminiStartRequest:
      type: object
      additionalProperties: false
      required: [url, gemini_free_consent]
      properties:
        url:
          type: string
          format: uri
          description: Supported public HTTPS YouTube URL.
        language_hint:
          $ref: "#/components/schemas/LanguageHint"
        gemini_free_consent:
          $ref: "#/components/schemas/GeminiFreeConsent"

    InstagramRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Supported public HTTPS Instagram Reel/video-post URL.
        language_hint:
          $ref: "#/components/schemas/LanguageHint"

    FacebookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Supported public HTTPS Facebook Reel/video URL.
        language_hint:
          $ref: "#/components/schemas/LanguageHint"

    TelegramRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Supported public HTTPS Telegram post URL with numeric post id.
        language_hint:
          $ref: "#/components/schemas/LanguageHint"

    GeminiYoutubePreflight:
      type: object
      additionalProperties: true
      properties:
        provider:
          type: string
          const: gemini
        provider_model:
          type: string
        mode:
          type: string
          const: youtube_direct
        platform:
          type: string
          const: youtube
        retrieval_provider:
          type: string
          const: gemini_youtube_url
        estimated_retrieval_credits:
          type: integer
          const: 0
        consent_required:
          type: boolean
          const: true
        consent_provider:
          type: string
          const: google_gemini
        consent_tier:
          type: string
          const: free
        data_use_notice:
          type: string
        automatic_paid_fallback:
          type: boolean
          const: false

    PublicCapabilities:
      type: object
      additionalProperties: true
      properties:
        mode:
          type: string
          const: zero_client_managed_beta
        provider:
          type: string
          const: gemini_youtube_direct+cobalt_retrieval+assemblyai_stt
        configured:
          type: boolean
        platforms:
          type: array
          items:
            type: string
            enum: [youtube, instagram, facebook, telegram]
        supadata_public_active:
          type: boolean
          const: false
        automatic_paid_fallback:
          type: boolean
          const: false
        paid_retrieval_fallback:
          type: boolean
          const: false
        paid_stt_fallback:
          type: boolean
          const: false
        youtube_retrieval_provider:
          type: string
          const: gemini_youtube_url
        youtube_retrieval_credits:
          type: integer
          const: 0
        youtube_stt_provider:
          type: string
          const: gemini
        youtube_gemini_free_tier_only:
          type: boolean
          const: true
        youtube_gemini_consent_required:
          type: boolean
          const: true
        instagram_retrieval_provider:
          type: string
          const: cobalt
        instagram_retrieval_credits:
          type: integer
          const: 0
        instagram_stt_provider:
          type: string
          const: assemblyai
        facebook_free_retrieval_provider:
          type: string
          const: cobalt
        facebook_stt_provider:
          type: string
          const: assemblyai
        telegram_retrieval_provider:
          type: string
          const: telegram_public_web
        telegram_retrieval_credits:
          type: integer
          const: 0
        telegram_stt_provider:
          type: string
          const: assemblyai

    ManagedJob:
      type: object
      additionalProperties: true
      properties:
        request_id:
          type: string
        job_id:
          type: string
          pattern: ^KRCM_[A-Za-z0-9-]+$
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
        source_url:
          type: string
          format: uri
        provider:
          type: string
          enum: [gemini, assemblyai]
        provider_mode:
          type: string
        provider_model:
          type: [string, "null"]
        retrieval_provider:
          type: [string, "null"]
        retrieval_credits_charged:
          type: integer
          minimum: 0
        stt_seconds_charged:
          type: integer
          minimum: 0
        segment_count:
          type: integer
          minimum: 0
        transcript_characters:
          type: integer
          minimum: 0
        reused:
          type: boolean
        error:
          type: [object, "null"]

    Segment:
      type: object
      additionalProperties: false
      required: [index, start_ms, end_ms, text, confidence]
      properties:
        index:
          type: integer
          minimum: 0
        start_ms:
          type: [integer, "null"]
          minimum: 0
        end_ms:
          type: [integer, "null"]
          minimum: 0
        text:
          type: string
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1

    SegmentPage:
      type: object
      additionalProperties: true
      properties:
        job_id:
          type: string
          pattern: ^KRCM_[A-Za-z0-9-]+$
        status:
          type: string
        cursor:
          type: integer
        next_cursor:
          type: [integer, "null"]
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
