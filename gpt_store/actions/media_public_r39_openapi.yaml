openapi: 3.1.0
info:
  title: K-Research & Critic Public MEDIA API
  version: 0.9.1-r39-unified-candidate
  description: >-
    R3 integration candidate for the existing published K-Research & Critic GPT.
    Supported public media routes are free-only and fail closed: YouTube uses
    Gemini Developer API Free Tier direct URL processing after explicit data-use
    consent; Instagram uses self-hosted Cobalt plus AssemblyAI universal-2;
    Facebook uses self-hosted Cobalt video+audio followed by server-side ffmpeg
    audio normalization and AssemblyAI universal-2; Telegram uses public Telegram
    web retrieval plus AssemblyAI universal-2. No automatic paid retrieval, paid
    STT, paid proxy, Supadata, ScrapeCreators, cookie, or login fallback is exposed.
x-krc-release-state: R39_UNIFIED_REPOSITORY_CANDIDATE_BUILDER_HOLD
x-krc-canonical-checkpoint: 182_R39_UNIFIED_KRC_GPT_ROUTING_CONTRACT_STAGING_READY_STATIC_PASS_PUBLIC_GPT_UNCHANGED_2026_09_22
x-krc-free-only-policy:
  paid_retrieval_fallback: false
  paid_stt_fallback: false
  paid_proxy_fallback: false
  supadata_public_active: false
  scrapecreators_public_active: false
  cookie_login_fallback: false
  failed_free_only_retry: fresh_deterministic_job
  failed_paid_or_charge_uncertain_retry: blocked
servers:
  - url: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
security:
  - bearerAuth: []
paths:
  /api/v1/media/public-capabilities:
    get:
      operationId: getPublicMediaCapabilities
      summary: Read public MEDIA routing and safety state
      x-openai-isConsequential: false
      responses:
        "200":
          description: Current public MEDIA capability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCapabilities"
        "401": {description: Action bearer authentication failed.}
        "503": {description: Public MEDIA is not configured.}

  /api/v1/media/youtube-gemini/preflight:
    post:
      operationId: preflightPublicGeminiYoutube
      summary: Check Gemini Free direct YouTube route and disclosure
      description: >-
        Validates the public YouTube URL and returns the Gemini Developer API
        Free Tier data-use disclosure. This operation does not call Gemini.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YoutubeRequest"}
      responses:
        "200":
          description: Gemini Free preflight and consent requirement.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeminiYoutubePreflight"}
        "400": {description: Invalid request.}
        "401": {description: Action bearer authentication failed.}
        "422": {description: Unsupported public YouTube URL.}
        "503": {description: Gemini Free direct YouTube route is unavailable.}

  /api/v1/media/youtube-gemini/lookup:
    post:
      operationId: lookupPublicGeminiYoutubeJob
      summary: Look up reusable durable YouTube state
      description: >-
        Looks up the current durable job chain without starting new Gemini work.
        COMPLETED and in-flight PROCESSING jobs may be reused. A prior FAILED
        free-only job does not block a later explicitly started fresh retry.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YoutubeRequest"}
      responses:
        "200":
          description: Existing durable YouTube job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "401": {description: Action bearer authentication failed.}
        "404": {description: Matching job was not found.}
        "422": {description: Unsupported public YouTube URL.}
        "503": {description: Durable state or Gemini route is unavailable.}

  /api/v1/media/youtube-gemini/transcriptions:
    post:
      operationId: startPublicGeminiYoutubeTranscription
      summary: Process a public YouTube video with Gemini Free
      description: >-
        Starts free-tier Gemini processing after explicit user acknowledgement.
        No paid or alternate-provider fallback is allowed. Reuses durable state
        when safe; failed free-only jobs require a new explicit retry request.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YoutubeGeminiStartRequest"}
      responses:
        "200":
          description: Job completed, processing, failed closed, reused, or freshly retried.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "400": {description: Invalid request.}
        "401": {description: Action bearer authentication failed.}
        "409": {description: Explicit Gemini Free data-use consent is missing.}
        "422": {description: Unsupported/unavailable video or empty transcript.}
        "429": {description: Free provider quota or public admission limit is exhausted.}
        "502": {description: Gemini provider could not be reached safely.}
        "503": {description: Durable state or Gemini Free route is unavailable.}

  /api/v1/media/youtube-gemini/transcriptions/{job_id}:
    get:
      operationId: getPublicGeminiYoutubeJob
      summary: Read durable YouTube job status
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, pattern: "^KRCM_[A-Za-z0-9-]+$"}
      responses:
        "200":
          description: Current durable YouTube job state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "401": {description: Action bearer authentication failed.}
        "404": {description: Job not found.}
        "503": {description: Durable MEDIA state is unavailable.}

  /api/v1/media/youtube-gemini/transcriptions/{job_id}/segments:
    get:
      operationId: getPublicGeminiYoutubeSegments
      summary: Read YouTube transcript segments
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, pattern: "^KRCM_[A-Za-z0-9-]+$"}
        - name: cursor
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Segment page; follow next_cursor until null.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SegmentPage"}
        "400": {description: Invalid pagination.}
        "401": {description: Action bearer authentication failed.}
        "404": {description: Job not found.}

  /api/v1/media/managed/preflight:
    post:
      operationId: preflightPublicInstagramCobalt
      summary: Check the Instagram Cobalt route
      description: >-
        Validates a supported public Instagram Reel/video URL. For R3 this
        generic public Cobalt start route is used only for Instagram; YouTube is
        always routed through the dedicated Gemini endpoint.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InstagramRequest"}
      responses:
        "200": {description: Zero-credit Instagram Cobalt/AssemblyAI preflight.}
        "401": {description: Action bearer authentication failed.}
        "422": {description: Unsupported public Instagram URL.}
        "503": {description: Public Cobalt route is unavailable.}

  /api/v1/media/managed/lookup:
    post:
      operationId: lookupPublicInstagramCobaltJob
      summary: Look up reusable durable Instagram state
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InstagramRequest"}
      responses:
        "200":
          description: Existing durable Instagram job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "404": {description: Matching job was not found.}
        "503": {description: Durable state or Cobalt route is unavailable.}

  /api/v1/media/managed/transcriptions:
    post:
      operationId: startPublicInstagramCobaltTranscription
      summary: Retrieve and transcribe a public Instagram video
      description: >-
        Uses self-hosted Cobalt plus AssemblyAI universal-2 with zero retrieval
        credits. Provider failure fails closed with no paid/Supadata fallback.
        Repeating the same logical start after a FAILED free-only job creates a
        fresh deterministic retry job while preserving in-flight concurrency
        protection.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InstagramRequest"}
      responses:
        "200":
          description: Job completed, processing, failed closed, reused, or freshly retried.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "422": {description: Unsupported URL or unusable media.}
        "429": {description: Free STT safety quota is exhausted.}
        "502": {description: Retrieval or STT provider could not be reached safely.}
        "503": {description: Durable state or provider route is unavailable.}

  /api/v1/media/managed/facebook-fallback:
    post:
      operationId: startPublicFacebookCobaltTranscription
      summary: Retrieve and transcribe a public Facebook video
      description: >-
        Starts the free Facebook route: Cobalt video+audio retrieval, server-side
        ffmpeg normalization, then AssemblyAI. No paid retrieval/STT/proxy fallback
        is allowed; unavailable free retrieval fails closed.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FacebookRequest"}
      responses:
        "200":
          description: Job completed, processing, failed closed, reused, or freshly retried.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "422": {description: Unsupported or unavailable public Facebook media.}
        "429": {description: Free STT safety quota is exhausted.}
        "502": {description: Retrieval or STT provider could not be reached safely.}
        "503": {description: Facebook route or durable state is unavailable.}

  /api/v1/media/managed/telegram:
    post:
      operationId: startPublicTelegramTranscription
      summary: Retrieve and transcribe a public Telegram video
      description: >-
        Uses public Telegram web retrieval and AssemblyAI universal-2 with zero
        retrieval credits. No Telegram account, cookies, session, bot token, or
        paid fallback is used. A FAILED free-only job may be started again as a
        fresh deterministic job.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TelegramRequest"}
      responses:
        "200":
          description: Job completed, processing, failed closed, reused, or freshly retried.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "422": {description: Public Telegram post or playable video is unavailable.}
        "429": {description: Free STT safety quota is exhausted.}
        "502": {description: Retrieval or STT provider could not be reached safely.}
        "503": {description: Telegram route or durable state is unavailable.}

  /api/v1/media/managed/transcriptions/{job_id}:
    get:
      operationId: getPublicNonYoutubeMediaJob
      summary: Read durable Instagram/Facebook/Telegram job status
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, pattern: "^KRCM_[A-Za-z0-9-]+$"}
      responses:
        "200":
          description: Current durable MEDIA job state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedJob"}
        "404": {description: Job not found.}
        "503": {description: Durable MEDIA state is unavailable.}

  /api/v1/media/managed/transcriptions/{job_id}/segments:
    get:
      operationId: getPublicNonYoutubeMediaSegments
      summary: Read Instagram/Facebook/Telegram transcript segments
      x-openai-isConsequential: false
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, pattern: "^KRCM_[A-Za-z0-9-]+$"}
        - name: cursor
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Segment page; follow next_cursor until null.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SegmentPage"}
        "400": {description: Invalid pagination.}
        "404": {description: Job not found.}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LanguageHint:
      type: string
      enum: [auto, uk, ru, en]
      default: auto

    YoutubeRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Supported public HTTPS YouTube URL.
        language_hint: {$ref: "#/components/schemas/LanguageHint"}

    GeminiFreeConsent:
      type: object
      additionalProperties: false
      required: [provider, tier, data_use_acknowledged]
      properties:
        provider: {type: string, const: google_gemini}
        tier: {type: string, const: free}
        data_use_acknowledged:
          type: boolean
          const: true
          description: True only after explicit user acknowledgement of the Gemini Free Tier data-use boundary.

    YoutubeGeminiStartRequest:
      type: object
      additionalProperties: false
      required: [url, gemini_free_consent]
      properties:
        url: {type: string, format: uri, description: Supported public HTTPS YouTube URL.}
        language_hint: {$ref: "#/components/schemas/LanguageHint"}
        gemini_free_consent: {$ref: "#/components/schemas/GeminiFreeConsent"}

    InstagramRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri, description: Supported public HTTPS Instagram Reel/video-post URL only.}
        language_hint: {$ref: "#/components/schemas/LanguageHint"}

    FacebookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri, description: Supported public HTTPS Facebook Reel/video URL.}
        language_hint: {$ref: "#/components/schemas/LanguageHint"}

    TelegramRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri, description: Supported public HTTPS Telegram post URL with numeric post id.}
        language_hint: {$ref: "#/components/schemas/LanguageHint"}

    GeminiYoutubePreflight:
      type: object
      additionalProperties: true
      properties:
        provider: {type: string, const: gemini}
        provider_model: {type: string}
        mode: {type: string, const: youtube_direct}
        platform: {type: string, const: youtube}
        retrieval_provider: {type: string, const: gemini_youtube_url}
        estimated_retrieval_credits: {type: integer, const: 0}
        consent_required: {type: boolean, const: true}
        consent_provider: {type: string, const: google_gemini}
        consent_tier: {type: string, const: free}
        data_use_notice: {type: string}
        automatic_paid_fallback: {type: boolean, const: false}

    PublicCapabilities:
      type: object
      additionalProperties: true
      properties:
        configured: {type: boolean}
        platforms:
          type: array
          items: {type: string, enum: [youtube, instagram, facebook, telegram]}
        supadata_public_active: {type: boolean, const: false}
        automatic_paid_fallback: {type: boolean, const: false}
        paid_retrieval_fallback: {type: boolean, const: false}
        paid_stt_fallback: {type: boolean, const: false}
        youtube_retrieval_provider: {type: string, const: gemini_youtube_url}
        youtube_retrieval_credits: {type: integer, const: 0}
        youtube_stt_provider: {type: string, const: gemini}
        youtube_gemini_free_tier_only: {type: boolean, const: true}
        youtube_gemini_consent_required: {type: boolean, const: true}
        instagram_retrieval_provider: {type: string, const: cobalt}
        instagram_retrieval_credits: {type: integer, const: 0}
        instagram_stt_provider: {type: string, const: assemblyai}
        facebook_free_retrieval_provider: {type: string, const: cobalt}
        facebook_stt_provider: {type: string, const: assemblyai}
        telegram_retrieval_provider: {type: string, const: telegram_public_web}
        telegram_retrieval_credits: {type: integer, const: 0}
        telegram_stt_provider: {type: string, const: assemblyai}

    ManagedJob:
      type: object
      additionalProperties: true
      properties:
        request_id: {type: string}
        job_id: {type: string, pattern: "^KRCM_[A-Za-z0-9-]+$"}
        status: {type: string, enum: [PROCESSING, COMPLETED, FAILED]}
        source_url: {type: string, format: uri}
        language_hint: {$ref: "#/components/schemas/LanguageHint"}
        provider: {type: string, enum: [gemini, assemblyai]}
        provider_mode: {type: string}
        provider_model: {type: [string, "null"]}
        retrieval_provider: {type: [string, "null"]}
        retrieval_credits_charged: {type: integer, minimum: 0}
        stt_seconds_charged: {type: integer, minimum: 0}
        segment_count: {type: integer, minimum: 0}
        transcript_characters: {type: integer, minimum: 0}
        reused: {type: boolean}
        credit_charge_uncertain: {type: boolean}
        error: {type: [object, "null"]}

    Segment:
      type: object
      additionalProperties: false
      required: [index, start_ms, end_ms, text, confidence]
      properties:
        index: {type: integer, minimum: 0}
        start_ms: {type: [integer, "null"], minimum: 0}
        end_ms: {type: [integer, "null"], minimum: 0}
        text: {type: string}
        confidence: {type: [number, "null"], minimum: 0, maximum: 1}

    SegmentPage:
      type: object
      additionalProperties: true
      properties:
        job_id: {type: string, pattern: "^KRCM_[A-Za-z0-9-]+$"}
        status: {type: string}
        cursor: {type: integer}
        next_cursor: {type: [integer, "null"]}
        segments:
          type: array
          items: {$ref: "#/components/schemas/Segment"}
