schema_version: "0.1"
status: PREPARED_READ_ONLY_DECISION_MATRIX
as_of: "2026-09-16"
source_checkpoint: subprojects/media_beta/99_KRC_CORE_MEDIA_MIGRATION_HARDENING_CHECKPOINT_2026_09_16.md

principles:
  inspect_before_binding: true
  migration_button_is_state_changing: true
  migrate_requires_separate_owner_approval: true
  preserve_public_gpt_until_replacement_regression_accepted: true
  preserve_all_13_media_operations: true
  read_fetch_only_is_insufficient_for_full_media_parity: true
  no_secret_in_skill_or_model_visible_output: true
  fail_closed_on_unknown_permissions: true

migration_observations:
  instructions_to_skill: expected
  connected_apps_to_apps: expected_when_supported
  custom_actions_auto_transfer: false
  conversation_starters_transfer_guaranteed: false
  previous_chats_transfer_guaranteed: false
  selected_model_transfer_guaranteed: false
  original_gpt_after_migration: READ_ONLY_UNTIL_RETIREMENT
  replacement_plugin_initial_access: PRIVATE_UNTIL_SHARED

required_krc_capabilities:
  core_skill: true
  native_web_or_equivalent_research_access: true
  native_data_analysis_or_equivalent: true
  media_operation_count: 13
  media_execution_required: true
  execution_operations:
    - startPublicGeminiYoutubeTranscription
    - startPublicInstagramCobaltTranscription
    - startPublicFacebookCobaltTranscription
    - startPublicTelegramTranscription
  explicit_youtube_gemini_free_consent: true
  durable_job_reuse: true
  explicit_failed_free_only_retry: true
  charge_uncertain_replay_block: true
  core_media_failure_isolation: true

surfaces:
  - id: builtin_gpt_to_plugin_migration
    purpose: migrate GPT instructions/configuration into replacement Plugin baseline
    inspect_first: true
    detect:
      - migration control is visible on the published KRC GPT
      - account/workspace notice confirms migration availability
    prerequisites_to_record:
      - user is creator or otherwise authorized migrator
      - plugins are enabled for the account/workspace
      - KRC GPT is eligible/published for the available migration flow
    acceptable_for_core: true
    acceptable_for_media_custom_actions_without_rebuild: false
    owner_approval_required_before_action: true
    forbidden_during_read_only_inspection:
      - click_migrate
      - confirm_migration
      - change_sharing
      - install_replacement
      - publish_replacement

  - id: supported_connected_app
    purpose: bind replacement Plugin to an app/connector that can expose VoiceBridge-backed MEDIA tools
    inspect_first: true
    eligible_if_all:
      - supports required execution/action tools, not only search/read
      - can preserve all 13 MEDIA semantic operations or a proven equivalent mapping
      - supports server-side authentication without model-visible secrets
      - supports required user/account audience and intended ChatGPT surface
      - supports explicit consent before YouTube provider work
    reject_if_any:
      - search_or_read_only
      - cannot represent execution/start operations
      - requires secrets in skill text or model-visible arguments
      - forces paid or unapproved provider fallback
      - cannot preserve Core isolation
    binding_status: NOT_SELECTED

  - id: custom_remote_mcp
    purpose: expose MEDIA operations through a supported remote MCP app/server
    inspect_first: true
    eligible_if_all:
      - custom MCP is available for the actual account/workspace and target surface
      - execution/write-capable tools are permitted for the account/workspace
      - remote MCP transport is supported
      - authentication can be held server-side or in the supported credential store
      - tool permission/review behavior is compatible with the four execution operations
      - intended web/desktop availability matches KRC replacement requirements
    reject_if_any:
      - account only permits read_fetch MCP
      - desktop_only when intended KRC replacement requires broader supported access
      - local_only_server_without_supported_tunnel_or_remote_transport
      - secrets would be exposed to model/user/repository
      - permissions cannot enforce required safety boundary
    binding_status: NOT_SELECTED

  - id: external_api_agent_fallback
    purpose: non-Plugin architecture fallback only if no supported ChatGPT Plugin/App/MCP surface can deliver required parity
    inspect_first: true
    eligible_if_all:
      - Plugin replacement cannot meet required MEDIA parity
      - owner explicitly approves product-architecture change
    default_status: HOLD
    binding_status: NOT_SELECTED

selection_order:
  - inspect builtin migration output and available app surfaces read-only
  - prefer a supported first-party Plugin/App binding when it preserves full semantics
  - otherwise evaluate custom remote MCP if execution/write support is available
  - use external architecture only after explicit owner decision

hard_stop_conditions:
  - migration action would make original GPT read-only before owner approval
  - available integration is read_fetch_only
  - execution permissions are ambiguous
  - sharing/audience would regress materially without explicit approval
  - secret handling cannot remain server-side
  - MEDIA operation parity cannot be proven
  - provider/free-only/retry invariants cannot be preserved

release_boundary:
  public_gpt_mutation: DENIED
  migration_execution: DENIED
  plugin_installation: DENIED
  plugin_publication: DENIED
  live_mcp_creation: DENIED
  render_change: DENIED
  main_mutation: DENIED
  pr22_merge: DENIED
  pr45_merge: DENIED
