name: A9.10 Private GPT E2E Acceptance

on:
  push:
    branches:
      - agent/video-url-research
    paths:
      - scripts/a9_10_accept_private_gpt_e2e.py
      - .github/workflows/a9-10-private-gpt-e2e-acceptance.yml
      - subprojects/media_beta/50_A9_10_PRIVATE_GPT_LOCAL_ATTACHMENT_E2E_ACCEPTANCE.md

permissions:
  contents: write
  pull-requests: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEDIA BETA feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/video-url-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply accepted-state patch
        run: python scripts/a9_10_accept_private_gpt_e2e.py

      - name: Validate accepted package
        run: |
          PYTHONPATH=. python scripts/validate_repository.py
          PYTHONPATH=. python scripts/validate_store_package.py
          PYTHONPATH=. pytest -q

      - name: Commit accepted A9.10 state
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gpt_store/media_beta_manifest.yaml \
            scripts/validate_store_package.py \
            tests/test_media_attachment_ingestion_package.py \
            tests/test_media_beta_builder_a9_7_i.py \
            tests/test_media_beta_managed_package.py \
            tests/test_claim_level_cross_check_enforcement.py
          git diff --cached --check
          git commit -m "A9.10 accept private GPT local attachment E2E"
          git push origin HEAD:agent/video-url-research
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh pr comment 8 --repo kolemasakar/K_Research_Critic --body "A9.10 local attachment private-GPT E2E: **ACCEPTED**. Commit: \`${ACCEPT_SHA}\`. Real owner MP4 -> trusted OpenAI attachment transport -> AssemblyAI -> durable KRCM -> CriticProfile -> explicit owner approval -> Research/Critic -> localized report completed. Report recorded 71 STT seconds, 2 segments, 0 retrieval/provider credits, and a real 0/1 SHORTFALL. Public/main promotion remains paused."
