schema_version: "1.0"

product:
  name: K-Research & Critic
  description: |-
    Користувач: планує роботу, погоджує критерії критика, перевіряє твердження, виправляє слабкі місця та формує фінальний звіт із джерелами й оцінкою надійності.
    (research supervisor for evidence-based planning, verification, critique, revision, and sourced reporting.)
  default_language: uk-UA
  primary_channel: chatgpt_store
  publication_state: published
  published_at: "2026-08-14"
  store_category: Research & Analysis

model:
  policy: user_plan
  recommended_model: null
  allow_user_model_switch: true

capabilities:
  web_search: true
  code_interpreter_data_analysis: true
  image_generation: false
  apps: false
  actions: false

knowledge:
  required: false
  files: []

instructions:
  file: prompts/GPT_STORE_INSTRUCTIONS.md
  version: "2.0-core-runtime-accepted"
  builder_character_limit: 8000
  default_report_language: uk-UA
  report_language_follows_source_language: false
  user_visible_labels_localized_to_report_language: true
  criticprofile_field_labels_localized_to_report_language: true
  profile_gate_mode: two_stage_direct_or_review
  profile_auto_display: false
  profile_direct_run_approves_profile: true
  profile_review_option: 2
  profile_cancel_option: 3
  recovered_review_required_uses_same_gate: true
  required_cross_checks_enforced: true
  cross_check_independence_required: true
  cross_check_claim_level_ledger_required: true
  cross_check_claim_level_output_required: true
  cross_check_shortfall_must_be_reported: true
  cross_check_unqualified_pass_on_shortfall_forbidden: true
  cross_check_traceability_required: true
  cross_check_achieved_cannot_exceed_visible_origins: true
  cross_check_systematic_review_counts_as_one_origin: true
  cross_check_protocol_table_required: true
  cross_check_protocol_table_heading_uk: ПІДСУМОК ЗА ТВЕРДЖЕННЯМИ
  cross_check_protocol_table_columns:
    - Твердження
    - Потрібно
    - Отримано незалежних
    - Виняток
  cross_check_floor_by_risk:
    LOW: 0
    MEDIUM: 1
    HIGH: 2
    CRITICAL: 3

checkpoint:
  schema_version: "1.0"
  marker: K_SUPERVISOR_CHECKPOINT
  contract: gpt_store/checkpoint.py
  example: gpt_store/checkpoint_example.json

request_log_mvp:
  status: APPS_SCRIPT_DEPLOYED_PENDING_BUILDER_WIRING
  selected_storage: google_sheets
  spreadsheet_id: 1icDvAkPx43s7568iZkANBCriz8UaanB4kMITO-icLaU
  sheet_name: Звернення
  timezone: Europe/Kyiv
  authentication: none
  full_prompt_storage: false
  user_name_mode: none
  topic_max_length: 160
  logging_failure_blocks_core_workflow: false
  apps_script_file: integrations/request_log/google_apps_script/Code.gs
  action_schema_file: integrations/request_log/openapi.yaml
  builder_addendum_file: prompts/GPT_STORE_REQUEST_LOG_ADDENDUM.md
  privacy_policy_file: docs/PRIVACY_POLICY_REQUEST_LOG.md
  google_sheet_created: true
  apps_script_deployed: true
  apps_script_deployed_at: "2026-08-23T16:40:00+03:00"
  apps_script_deployment_url: https://script.google.com/macros/s/AKfycbwYLrCEtLTRnB91amNUbpAzah6DvXPhhOoo-jCUOU1LgHCsMnu34BKXEix8dkA5r6IR/exec
  builder_action_configured: false
  runtime_accepted: false

conversation_starters:
  - "Досліди цю тему та спочатку сформуй CriticProfile для мого погодження."
  - "Порівняй дві технології за незалежними джерелами та покажи невирішені ризики."
  - "Перевір це твердження, включно з доказами на його підтримку або спростування."
  - "Віднови завдання K-Research & Critic з checkpoint, який я надам."
  - "Research this topic and build the CriticProfile for my approval before you start."
  - "Compare two technologies using independent sources and show unresolved risks."
  - "Verify this claim, including evidence that supports or contradicts it."
  - "Resume a K-Research & Critic task from a checkpoint I will paste."

release:
  free_user_compatible: true
  developer_api_key_required: false
  external_backend_required: false
  privacy_policy_url_required_by_package: false
