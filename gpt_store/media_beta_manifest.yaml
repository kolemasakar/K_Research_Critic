schema_version: "0.6-beta"

product:
  name: K-Research & Critic - MEDIA BETA
  description: |-
    Приватне owner-only тестування zero-client аналізу публічних YouTube-відео, Instagram Reel та Facebook media.
    (owner-only zero-client media-input beta for K-Research & Critic.)
  default_language: uk-UA
  primary_channel: chatgpt_private_beta
  publication_state: private_owner_only

model:
  policy: user_plan
  recommended_model: null
  allow_user_model_switch: true

capabilities:
  web_search: true
  code_interpreter_data_analysis: true
  image_generation: false
  apps: false
  actions: true

knowledge:
  required: false
  files: []

instructions:
  file: prompts/GPT_STORE_MEDIA_BETA_BUILDER_INSTRUCTIONS.md
  canonical_reference: prompts/GPT_STORE_MEDIA_MANAGED_BETA_INSTRUCTIONS.md
  version: "0.8-beta-a9.9"
  builder_package_version: "0.8-beta-a9.9"
  builder_target_action_schema_version: "0.5.0-a9.9"
  builder_package_ready: true
  builder_runtime_applied: false
  builder_policy_fix_runtime_applied: true
  builder_character_limit: 8000
  default_report_language: uk-UA
  report_language_follows_source_language: false
  verdict_labels_localized_to_report_language: true
  user_visible_labels_localized_to_report_language: true
  criticprofile_field_labels_localized_to_report_language: true
  ukrainian_required_headings:
    - ФІНАЛЬНИЙ ЗВІТ
    - ПЕРЕВІРКА ТВЕРДЖЕНЬ
    - ПРОТОКОЛ ПЕРЕВІРКИ
    - ПІДСУМОК ЗА ТВЕРДЖЕННЯМИ
  profile_gate_mode: two_stage_direct_or_review
  profile_auto_display: false
  profile_direct_run_approves_profile: true
  profile_review_option: 2
  profile_cancel_option: 3
  recovered_review_required_uses_same_gate: true
  required_cross_checks_enforced: true
  cross_check_independence_required: true
  cross_check_shortfall_must_be_reported: true
  cross_check_protocol_summary_required: true
  cross_check_claim_level_ledger_required: true
  cross_check_claim_level_output_required: true
  cross_check_unqualified_pass_on_shortfall_forbidden: true
  cross_check_traceability_required: true
  cross_check_achieved_cannot_exceed_visible_origins: true
  cross_check_systematic_review_counts_as_one_origin: true
  cross_check_protocol_table_required: true
  cross_check_protocol_table_heading_uk: ПІДСУМОК ЗА ТВЕРДЖЕННЯМИ
  cross_check_protocol_table_columns:
    - Твердження
    - Потрібно
    - Отримано незалежних
    - Виняток
  cross_check_ledger_fields:
    - required
    - achieved_independent
    - exception
  cross_check_floor_by_risk:
    LOW: 0
    MEDIUM: 1
    HIGH: 2
    CRITICAL: 3

actions:
  media_transcript:
    enabled: true
    schema: gpt_store/actions/media_managed_beta_openapi.yaml
    authentication: bearer_api_key
    server: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
    privacy_policy_document: docs/PRIVACY_POLICY.md

checkpoint:
  schema_version: "1.0"
  marker: K_SUPERVISOR_CHECKPOINT
  contract: gpt_store/checkpoint.py
  example: gpt_store/checkpoint_example.json

beta:
  access_model: private_gpt_action_bearer_plus_server_owner_admission
  intended_testers: 1
  owner_only: true
  ingress_mode: managed_zero_client
  browser_helper_required: false
  browser_helper_normal_flow_allowed: false
  browser_assisted_a8_fallback_preserved: true
  managed_job_prefix: KRCM_
  public_platforms_live_accepted:
    - youtube
    - instagram
    - facebook
  public_platforms_in_progress:
    - telegram
  public_platforms_not_started: []
  local_upload_live_accepted: false
  max_video_seconds: 3600
  managed_provider: supadata
  managed_provider_mode: native_first
  managed_native_credit_cost: 1
  managed_credit_preflight_required: true
  managed_explicit_user_consent_required: true
  managed_automatic_ai_fallback: false
  managed_ai_requires_second_consent: true
  managed_instagram_ai_fallback_live_accepted: true
  managed_instagram_ai_rate_credits_per_minute: 2
  managed_instagram_ai_hard_cap_credits: 40
  managed_facebook_retrieval_stt_code_ready: true
  managed_facebook_free_retrieval_provider: cobalt
  managed_facebook_free_path_live_accepted: true
  managed_facebook_free_failure_behavior: unavailable
  managed_facebook_paid_retrieval_provider: scrapecreators
