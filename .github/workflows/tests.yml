name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          python -m pytest --version

      - name: Run tests
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and quality dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Dependency integrity
        run: python -m pip check

      - name: Repository policy validation
        run: python -m scripts.validate_repository

      - name: Ruff
        run: python -m ruff check agents config models persistence supervisor tools tests

      - name: Mypy
        run: python -m mypy agents config models persistence supervisor tools

      - name: Coverage
        run: >-
          python -m pytest -q tests
          --cov=agents
          --cov=config
          --cov=models
          --cov=persistence
          --cov=supervisor
          --cov=tools
          --cov-report=term-missing
          --cov-fail-under=70
