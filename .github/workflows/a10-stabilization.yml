name: A10 Stabilization

on:
  push:
    branches:
      - agent/video-url-research
    paths:
      - scripts/a10_stabilization_patch.py
      - .github/workflows/a10-stabilization.yml
      - prompts/GPT_STORE_MEDIA_BETA_BUILDER_INSTRUCTIONS.md
      - prompts/GPT_STORE_MEDIA_MANAGED_BETA_INSTRUCTIONS.md
      - gpt_store/media_beta_manifest.yaml
      - subprojects/media_beta/51_A10_STABILIZATION_AND_RELEASE_BOUNDARY.md

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEDIA BETA feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/video-url-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply A10 stabilization patch
        run: python scripts/a10_stabilization_patch.py

      - name: Validate package
        run: |
          PYTHONPATH=. python scripts/validate_repository.py
          PYTHONPATH=. python scripts/validate_store_package.py
          PYTHONPATH=. pytest -q

      - name: Commit stabilized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/validate_store_package.py \
            tests/test_media_beta_builder_a9_7_i.py \
            tests/test_media_attachment_ingestion_package.py \
            tests/test_media_beta_managed_package.py \
            tests/test_claim_level_cross_check_enforcement.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "A10 validate stabilization package"
            git push origin HEAD:agent/video-url-research
          fi
