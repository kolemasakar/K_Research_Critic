name: KRC MEDIA Sync Auth Input Replay Acceptance

on:
  push:
    branches:
      - agent/video-url-research
    paths:
      - .github/workflows/krc-media-sync-auth-input-replay.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical MEDIA BETA state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('subprojects/media_beta/03_CURRENT_STATE.md')
          s = p.read_text()
          checks = [
              'Version: 7.1',
              'CROSS_ROUTE_NEGATIVE_ROUTING_MATRIX_ACCEPTED\nA10_COPY_SAFE_CLAIM_TABLE_RUNTIME_ACCEPTED',
              'cross-route acceptance-record head at 2026-08-29 sync: c1ab9a9cabcbc1859373da3106eac58ca67b86fb',
              '## Research/Critic Invariants',
          ]
          for c in checks:
              if c not in s:
                  raise SystemExit(f'expected baseline text missing: {c}')
          s = s.replace('Version: 7.1', 'Version: 7.2', 1)
          s = s.replace(
              'CROSS_ROUTE_NEGATIVE_ROUTING_MATRIX_ACCEPTED\nA10_COPY_SAFE_CLAIM_TABLE_RUNTIME_ACCEPTED',
              'CROSS_ROUTE_NEGATIVE_ROUTING_MATRIX_ACCEPTED\nAUTH_INPUT_REPLAY_NEGATIVE_MATRIX_ACCEPTED\nA10_COPY_SAFE_CLAIM_TABLE_RUNTIME_ACCEPTED',
              1,
          )
          old_para = 'Local attachment and Instagram route-boundary audits passed, and the cross-route negative routing matrix is now live-accepted: foreign platforms are stopped at the HTTP/parser boundary before provider or durable-store service methods. The owner continues private testing before release decisions.'
          new_para = 'Local attachment and Instagram route-boundary audits passed, and the cross-route negative routing matrix is live-accepted: foreign platforms are stopped at the HTTP/parser boundary before provider or durable-store service methods. The later auth/input/replay negative matrix is also accepted: Action bearer failures, malformed/oversized input, invalid methods/IDs/pagination, server-side owner admission, and duplicate replay boundaries were hardened or revalidated without a new provider-consuming media job. The owner continues private testing before release decisions.'
          if old_para not in s:
              raise SystemExit('executive paragraph baseline missing')
          s = s.replace(old_para, new_para, 1)
          s = s.replace(
              'cross-route acceptance-record head at 2026-08-29 sync: c1ab9a9cabcbc1859373da3106eac58ca67b86fb\ndraft PR: #28',
              'cross-route acceptance-record head at 2026-08-29 sync: c1ab9a9cabcbc1859373da3106eac58ca67b86fb\nauth/input/replay implementation: e83a13a09b9bbcf293fb4f2d705f4ea7f15712b7\nauth/input/replay acceptance-record head at 2026-08-29 sync: 4ef9784655c413625e364b9f6eb1a43f1d26b96d\ndraft PR: #28',
              1,
          )
          section = '''## Auth / Input / Replay Negative Matrix Acceptance

Accepted owner-testing record in VoiceBridge:

```text
docs/history/KRC_MEDIA_AUTH_INPUT_REPLAY_NEGATIVE_MATRIX_2026-08-29.md
```

Implementation and validation:
- VoiceBridge implementation commit `e83a13a09b9bbcf293fb4f2d705f4ea7f15712b7`;
- caller-supplied `beta_access_code` can no longer override the configured server owner admission code: PASS;
- missing Action bearer fails before service work: PASS;
- invalid/malformed Action bearer fails before service work: PASS;
- malformed JSON and oversized request bodies fail before service work: PASS;
- wrong HTTP methods and malformed job IDs fail closed: PASS;
- invalid/out-of-range pagination fails before segment reads: PASS;
- injection-shaped pagination fails closed; static application validation returns `INVALID_PAGINATION`, while the isolated live path may be denied earlier by the upstream edge: PASS;
- duplicate native replay remains a single provider start in fake-provider regression even when the caller varies a supplied beta code: PASS;
- full VoiceBridge cloud suite in corrected hardening run `33260208780`: 142/142 PASS;
- final isolated live no-spend run `33260540049`: SUCCESS;
- exact hardened implementation deployed for live acceptance: PASS;
- provider-consuming media work during live acceptance: NONE;
- Render environment mutation: NONE;
- Neon database mutation requested: NONE.

The first hardening workflow attempt stopped on a TypeScript test-harness compile defect before an implementation commit was pushed. Two early live-smoke harness attempts were also refined: the second showed that an injection-shaped pagination query is rejected by the upstream edge with HTTP 403 before the application can emit its own `INVALID_PAGINATION`. These harness corrections do not represent provider, durable-store, or runtime-data failures.

Final VoiceBridge exact-head validation at `4ef9784655c413625e364b9f6eb1a43f1d26b96d`:
- `Validate` run `33260645359`: SUCCESS;
- `A9.7-F Cobalt Package Validate` run `33260645389`: SUCCESS;
- `A9.10 Attachment Probe Validate` run `33260645358`: SUCCESS.

'''
          s = s.replace('## Research/Critic Invariants', section + '## Research/Critic Invariants', 1)
          old_rule = 'The active Facebook and Telegram server boundaries are hardened to their accepted dedicated-route policies, and the cross-route negative routing matrix is live-accepted. Local attachment and Instagram route-boundary audits are accepted.'
          new_rule = 'The active Facebook and Telegram server boundaries are hardened to their accepted dedicated-route policies, the cross-route negative routing matrix is live-accepted, and the auth/input/replay negative matrix is accepted. Local attachment and Instagram route-boundary audits are accepted.'
          if old_rule not in s:
              raise SystemExit('current work rule baseline missing')
          s = s.replace(old_rule, new_rule, 1)
          p.write_text(s)
          PY
      - name: Commit synchronized state and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/krc-media-sync-auth-input-replay.yml
          git add subprojects/media_beta/03_CURRENT_STATE.md
          git commit -m "Sync MEDIA BETA auth input replay acceptance"
          git push origin HEAD:agent/video-url-research
