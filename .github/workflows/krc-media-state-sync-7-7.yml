name: KRC MEDIA State Sync 7.7
'on':
  push:
    branches:
      - agent/video-url-research
    paths:
      - .github/workflows/krc-media-state-sync-7-7.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/video-url-research
          fetch-depth: 0
      - name: Apply state sync
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('subprojects/media_beta/03_CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          if 'Version: 7.6' not in text:
              raise SystemExit('Expected Version 7.6 not found')
          text = text.replace('Version: 7.6', 'Version: 7.7', 1)

          marker = 'PRIVACY_CLEANUP_NEGATIVE_MATRIX_ACCEPTED\n'
          if marker not in text:
              raise SystemExit('Privacy cleanup marker not found')
          text = text.replace(marker, marker + 'RETENTION_LOG_REDACTION_NEGATIVE_MATRIX_ACCEPTED\n', 1)

          old = 'The privacy/cleanup negative matrix is also accepted: signed attachment transport URLs and raw owner admission are excluded from durable/public projections, cleanup failure remains explicit, and provider/local temporary cleanup guards are retained. The owner continues private testing before release decisions.'
          new = 'The privacy/cleanup negative matrix is also accepted: signed attachment transport URLs and raw owner admission are excluded from durable/public projections, cleanup failure remains explicit, and provider/local temporary cleanup guards are retained. The retention/log-redaction negative matrix is also accepted: normal zero-credit jobs follow configured TTL, charged or uncertain jobs preserve at least a 24-hour recovery window, expired durable state is pruned, structured diagnostics remain metadata-only, and persistence/HTTP paths suppress sensitive log payloads. The owner continues private testing before release decisions.'
          if old not in text:
              raise SystemExit('Executive paragraph anchor not found')
          text = text.replace(old, new, 1)

          repo_anchor = 'privacy/cleanup acceptance record: docs/history/KRC_MEDIA_PRIVACY_CLEANUP_NEGATIVE_MATRIX_2026-08-29.md\n'
          if repo_anchor not in text:
              raise SystemExit('VoiceBridge privacy repository anchor not found')
          text = text.replace(
              repo_anchor,
              repo_anchor +
              'retention/log-redaction corrected regression: 43bd757b541f9dcbffa40041228466a6eaa38c7d\n' +
              'retention/log-redaction acceptance record: docs/history/KRC_MEDIA_RETENTION_LOG_REDACTION_NEGATIVE_MATRIX_2026-08-29.md\n',
              1,
          )

          section_anchor = '\n## Research/Critic Invariants\n'
          if section_anchor not in text:
              raise SystemExit('Research/Critic section anchor not found')
          section = '''
## Retention / Log-Redaction Negative Matrix Acceptance

Accepted owner-testing record in VoiceBridge:

```text
docs/history/KRC_MEDIA_RETENTION_LOG_REDACTION_NEGATIVE_MATRIX_2026-08-29.md
```

Validation:
- retained regression `src/cloud/tests/managed_media_retention_log_redaction.test.ts`;
- zero-credit/certain managed-media jobs follow the configured normal TTL: PASS;
- charged or charge-uncertain outcomes preserve at least a 24-hour recovery window: PASS;
- uncertain provider failure is non-retryable and not automatically replayed: PASS;
- expired durable managed-media jobs are purged and expired records are excluded from reads: PASS;
- durable STT quota-ledger records older than two UTC days are pruned: PASS;
- structured managed-media diagnostic warning is metadata-only and excludes sensitive source/access/transcript/media fields: PASS;
- durable PostgreSQL stderr payloads are suppressed and generic persistence errors are exposed: PASS;
- managed-media HTTP responses are `cache-control: no-store` and contain no console request-body logging: PASS;
- initial VoiceBridge run `33267727322`: 167/168 PASS; the single failure was a test-harness false positive that confused normal response serialization with logging;
- corrected VoiceBridge run `33267869660`: 168/168 PASS;
- provider-consuming work: NONE;
- Render environment mutation: NONE;
- Neon data mutation requested: NONE;
- paid Facebook/ScrapeCreators activation: NONE.

This acceptance does not activate the separately pending Gemini 3.5 Transcribe transition plan.
'''
          text = text.replace(section_anchor, '\n' + section + section_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate state sync
        run: |
          grep -Fq 'Version: 7.7' subprojects/media_beta/03_CURRENT_STATE.md
          grep -Fq 'RETENTION_LOG_REDACTION_NEGATIVE_MATRIX_ACCEPTED' subprojects/media_beta/03_CURRENT_STATE.md
          grep -Fq '33267869660' subprojects/media_beta/03_CURRENT_STATE.md
          grep -Fq 'RELEASE_HOLD_OWNER_TESTING' subprojects/media_beta/03_CURRENT_STATE.md
          grep -Fq 'does not activate the separately pending Gemini 3.5 Transcribe transition plan' subprojects/media_beta/03_CURRENT_STATE.md
      - name: Commit accepted state and remove harness
        run: |
          rm .github/workflows/krc-media-state-sync-7-7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subprojects/media_beta/03_CURRENT_STATE.md .github/workflows/krc-media-state-sync-7-7.yml
          git commit -m 'Sync MEDIA BETA retention log-redaction acceptance'
          git push origin HEAD:agent/video-url-research
