name: KRC MEDIA State Sync 7.4
'on':
  push:
    branches:
      - agent/video-url-research
    paths:
      - .github/workflows/krc-media-state-sync-7-4.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply state sync
        run: python scripts/krc_media_state_sync_7_4.py
      - name: Validate state sync
        run: |
          grep -q '^Version: 7.4$' subprojects/media_beta/03_CURRENT_STATE.md
          grep -q '^CONSENT_CREDIT_QUOTA_NEGATIVE_MATRIX_ACCEPTED$' subprojects/media_beta/03_CURRENT_STATE.md
          grep -q '33264731836' subprojects/media_beta/56_CONSENT_CREDIT_QUOTA_NEGATIVE_MATRIX_ACCEPTED.md
      - name: Commit accepted state and remove harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/krc-media-state-sync-7-4.yml scripts/krc_media_state_sync_7_4.py
          git add subprojects/media_beta/03_CURRENT_STATE.md subprojects/media_beta/56_CONSENT_CREDIT_QUOTA_NEGATIVE_MATRIX_ACCEPTED.md
          git commit -m 'Sync MEDIA BETA consent credit quota acceptance'
          git push origin HEAD:agent/video-url-research
