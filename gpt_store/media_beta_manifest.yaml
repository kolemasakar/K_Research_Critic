  managed_facebook_paid_retrieval_requires_separate_consent: true
  managed_facebook_automatic_paid_retrieval: false
  managed_facebook_stt_provider: assemblyai
  managed_facebook_live_accepted: true
  managed_telegram_code_ready: true
  managed_telegram_backend_live_accepted: true
