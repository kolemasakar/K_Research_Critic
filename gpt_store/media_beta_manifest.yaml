  managed_telegram_retrieval_credits: 0
  managed_telegram_stt_provider: assemblyai
  managed_telegram_action_schema_ready: true
  managed_telegram_builder_runtime_applied: false
  managed_telegram_private_gpt_e2e_complete: false
  managed_user_beta_access_code_required: false
  managed_owner_access_injected_server_side: true
  managed_durable_store: postgres
  managed_restart_resilient_jobs: true
  managed_duplicate_start_reuses_job: true
  provider_balance_after_a9_3_acceptance: 98
  legacy_browser_assisted:
    job_prefix: KRCC_
    helper_version: "0.2.2"
    daily_stt_seconds: 7200
    durable_store: postgres
    stt_provider: assemblyai
    stt_endpoint: https://api.eu.assemblyai.com
    status: A8_ACCEPTED_FALLBACK_ONLY
  credential_handling:
    action_bearer_server_side: true
    owner_beta_admission_server_side: true
    provider_key_server_side: true
    never_echo: true
    never_checkpoint: true
    never_log: true

