name: A9.10 Attachment Ingestion Package

on:
  push:
    branches:
      - agent/video-url-research
    paths:
      - scripts/a9_10_attachment_ingestion_package_patch.py
      - .github/workflows/a9-10-attachment-ingestion-package.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEDIA BETA feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/video-url-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply A9.10 attachment Action package patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/a9_10_attachment_ingestion_package_patch.py > /tmp/a9-10-package-patch.log 2>&1
          code=$?
          cat /tmp/a9-10-package-patch.log
          exit $code

      - name: Validate repository and GPT package
        id: validate
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validate_repository.py > /tmp/a9-10-package-validate.log 2>&1
          code=$?
          if [[ $code -eq 0 ]]; then
            python scripts/validate_store_package.py >> /tmp/a9-10-package-validate.log 2>&1
            code=$?
          fi
          if [[ $code -eq 0 ]]; then
            pytest -q >> /tmp/a9-10-package-validate.log 2>&1
            code=$?
          fi
          cat /tmp/a9-10-package-validate.log
          exit $code

      - name: Commit A9.10 private GPT attachment package
        id: commit
        if: steps.patch.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gpt_store/actions/media_managed_beta_openapi.yaml \
            prompts/GPT_STORE_MEDIA_BETA_BUILDER_INSTRUCTIONS.md \
            gpt_store/media_beta_manifest.yaml \
            scripts/validate_store_package.py \
            tests/test_media_attachment_probe_package.py \
            tests/test_media_attachment_ingestion_package.py \
            tests/test_media_beta_builder_a9_7_i.py \
            tests/test_media_beta_managed_package.py
          git diff --cached --check
          git commit -m "A9.10 prepare local attachment transcription Action package"
          git push origin HEAD:agent/video-url-research
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PATCH_OUTCOME" == "success" && "$VALIDATE_OUTCOME" == "success" && -n "${PATCH_SHA:-}" ]]; then
            gh pr comment 8 --repo kolemasakar/K_Research_Critic --body "A9.10 local attachment transcription Action package: **PASS**. Commit: \`${PATCH_SHA}\`. The private MEDIA Action now contains \`startManagedAttachmentTranscription\`; local attachment retrieval is zero-credit and uses runtime \`openaiFileIdRefs\`, while Builder application and full private-GPT E2E remain pending. Repository validation, Store package validation and pytest passed."
          else
            if [[ "$PATCH_OUTCOME" != "success" ]]; then
              diag="$(tail -n 60 /tmp/a9-10-package-patch.log 2>/dev/null || true)"
              phase="patch"
            else
              diag="$(tail -n 100 /tmp/a9-10-package-validate.log 2>/dev/null || true)"
              phase="validation"
            fi
            [[ ${#diag} -le 7000 ]] || diag="${diag:0:7000}"
            body=$(printf 'A9.10 local attachment transcription Action package: **FAIL** at `%s`. Diagnostic:\n```text\n%s\n```\nNo public/main promotion was performed.' "$phase" "$diag")
            gh pr comment 8 --repo kolemasakar/K_Research_Critic --body "$body"
            exit 1
          fi
