name: A9.9 Schema Policy Alignment

on:
  push:
    branches:
      - agent/video-url-research
    paths:
      - .github/workflows/a9-9-schema-policy-alignment.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout MEDIA branch
        uses: actions/checkout@v6
        with:
          ref: agent/video-url-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Align schema policy wording
        # v2: corrected anchors against committed A9.9 package
        run: python scripts/a9_9_schema_policy_alignment_patch.py

      - name: Validate
        run: |
          python -m scripts.validate_repository
          python -m scripts.validate_store_package
          python -m pytest -q

      - name: Commit aligned schema
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpt_store/actions/media_managed_beta_openapi.yaml tests/test_media_beta_builder_a9_7_i.py
          git commit -m "A9.9: align Action schema with Facebook terminal-failure policy"
          git push origin HEAD:agent/video-url-research
