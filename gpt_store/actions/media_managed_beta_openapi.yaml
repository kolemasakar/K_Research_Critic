openapi: 3.1.0
info:
  title: K-Research & Critic Managed Media Beta API
  version: 0.3.0-a9.6
  description: >-
    Owner-only zero-client managed transcript beta for public YouTube and Instagram.
    Native transcript processing always requires credit preflight and explicit user
    approval. Instagram Reel AI generation is available only after a native
    transcript-unavailable stop, a separate AI preflight, and a second explicit
    user approval. Action bearer and owner admission credentials remain server-side.
servers:
  - url: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
paths:
  /api/v1/media/managed/preflight:
    post:
      operationId: preflightManagedMediaCredits
      summary: Read managed native transcript credit balance and cost estimate
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightRequest"
      responses:
        "200":
          description: Native credit quote. This does not authorize transcript processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPreflight"
        "400":
          description: Invalid or unsupported media URL or language hint.
        "401":
          description: Private GPT Action authentication failed.
        "503":
          description: Managed transcript provider is not configured or unavailable.
  /api/v1/media/managed/transcriptions:
    post:
      operationId: startManagedMediaNativeTranscription
      summary: Spend at most one approved credit on a native managed transcript
      description: >-
        Call only after native credit preflight and explicit user approval. The
        request is capped at one Supadata native credit. If native captions are
        unavailable, return AWAITING_AI_CONSENT. Never start AI automatically.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeTranscriptRequest"
      responses:
        "200":
          description: Native request completed, processing, failed, or stopped awaiting separate AI consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "400":
          description: Invalid request.
        "401":
          description: Private GPT Action authentication failed.
        "409":
          description: Explicit one-credit native consent is missing or invalid.
        "429":
          description: Provider credits are exhausted or provider rate limit reached.
        "503":
          description: Managed transcript provider is not configured or unavailable.
  /api/v1/media/managed/transcriptions/{job_id}:
    get:
      operationId: getManagedMediaTranscriptionStatus
      summary: Read managed media job status and actual cumulative credit charge
      x-openai-isConsequential: false
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current managed media job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "404":
          description: Job not found.
  /api/v1/media/managed/transcriptions/{job_id}/segments:
    get:
      operationId: getManagedMediaTranscriptSegments
      summary: Read timestamped managed transcript segments
      x-openai-isConsequential: false
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: Transcript segment page. Follow next_cursor until null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentPage"
        "404":
          description: Job not found.
  /api/v1/media/managed/transcriptions/{job_id}/ai-preflight:
    get:
      operationId: preflightManagedMediaAiCredits
      summary: Read separate Instagram Reel AI credit ceiling before AI consent
      description: >-
        Call only after the native job returns AWAITING_AI_CONSENT. This reads the
        provider balance and conservative Instagram Reel AI ceiling. It does not
        start AI transcription or authorize any AI credit spend.
      x-openai-isConsequential: false
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Separate AI credit quote. This does not authorize AI processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCreditPreflight"
        "401":
          description: Private GPT Action authentication failed.
        "404":
          description: Job not found.
        "409":
          description: Job is not awaiting separate AI consent.
        "422":
          description: Current AI fallback does not support this source type.
        "503":
          description: Managed AI transcript provider is unavailable.
  /api/v1/media/managed/transcriptions/{job_id}/ai:
    post:
      operationId: startManagedMediaAiTranscription
      summary: Start consent-gated AI transcription for an Instagram Reel
      description: >-
        Call only after AI preflight and a new explicit user approval. The consent
        is separate from native approval and capped at 40 credits. This endpoint
        never runs automatically and reuses an already completed AI job.
      x-openai-isConsequential: true
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTranscriptRequest"
      responses:
        "200":
          description: AI transcript request completed, processing, failed, or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "401":
          description: Private GPT Action authentication failed.
        "404":
          description: Job not found.
        "409":
          description: Separate AI credit consent is missing, invalid, or not applicable.
        "422":
          description: Current AI fallback does not support this source type.
        "429":
          description: Balance is below the conservative AI credit ceiling.
        "503":
          description: Managed AI transcript provider is unavailable.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^KRCM_[A-Za-z0-9-]+$
  schemas:
    PreflightRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Public HTTPS YouTube or Instagram Reel/video URL.
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
          default: auto
    NativeTranscriptRequest:
      type: object
      additionalProperties: false
      required: [url, credit_consent]
      properties:
        url:
          type: string
          format: uri
          description: Public HTTPS YouTube or Instagram Reel/video URL.
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
          default: auto
        credit_consent:
          type: object
          additionalProperties: false
          required: [provider, mode, max_credits]
          properties:
            provider:
              type: string
              const: supadata
            mode:
              type: string
              const: native
            max_credits:
              type: integer
              const: 1
              description: Hard user-approved maximum for this native operation.
    AiTranscriptRequest:
      type: object
      additionalProperties: false
      required: [credit_consent]
      properties:
        credit_consent:
          type: object
          additionalProperties: false
          required: [provider, mode, max_credits]
          properties:
            provider:
              type: string
              const: supadata
            mode:
              type: string
              const: generate
            max_credits:
              type: integer
              const: 40
              description: Separate conservative user-approved maximum for Instagram Reel AI transcription.
    CreditPreflight:
      type: object
      required:
        - provider
        - mode
        - plan
        - credits_available
        - estimated_credits
        - credits_after_estimate
        - can_continue
        - consent_required
        - consent_options
      properties:
        request_id:
          type: string
        source_url:
          type: string
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
        provider:
          type: string
          const: supadata
        mode:
          type: string
          const: native
        plan:
          type: string
        credits_available:
          type: number
          minimum: 0
        estimated_credits:
          type: integer
          const: 1
        credits_after_estimate:
          type: number
          minimum: 0
        can_continue:
          type: boolean
        consent_required:
          type: boolean
          const: true
        consent_options:
          $ref: "#/components/schemas/ConsentOptions"
    AiCreditPreflight:
      type: object
      required:
        - job_id
        - source_url
        - provider
        - mode
        - plan
        - credits_available
        - estimated_credits
        - maximum_credits
        - credits_per_minute
        - maximum_duration_minutes
        - credits_after_estimate
        - conservative_maximum
        - can_continue
        - consent_required
        - consent_options
      properties:
        request_id:
          type: string
        job_id:
          type: string
          pattern: ^KRCM_[A-Za-z0-9-]+$
        source_url:
          type: string
        provider:
          type: string
          const: supadata
        mode:
          type: string
          const: generate
        plan:
          type: string
        credits_available:
          type: number
          minimum: 0
        estimated_credits:
          type: integer
          const: 40
        maximum_credits:
          type: integer
          const: 40
        credits_per_minute:
          type: integer
          const: 2
        maximum_duration_minutes:
          type: integer
          const: 20
        credits_after_estimate:
          type: number
          minimum: 0
        conservative_maximum:
          type: boolean
          const: true
        can_continue:
          type: boolean
        consent_required:
          type: boolean
          const: true
        consent_options:
          $ref: "#/components/schemas/ConsentOptions"
    ConsentOptions:
      type: object
      required: [approve, reject]
      properties:
        approve:
          type: integer
          const: 1
        reject:
          type: integer
          const: 2
    ManagedJob:
      type: object
      properties:
        request_id:
          type: string
        job_id:
          type: string
          pattern: ^KRCM_[A-Za-z0-9-]+$
        status:
          type: string
          enum: [PROCESSING, COMPLETED, AWAITING_AI_CONSENT, FAILED]
        created_at:
          type: string
        updated_at:
          type: string
        source_url:
          type: string
        language_hint:
          type: string
          enum: [auto, uk, ru, en]
        provider:
          type: string
          const: supadata
        provider_mode:
          type: string
          enum: [native, generate]
        detected_language:
          anyOf:
            - type: string
            - type: "null"
        available_languages:
          type: array
          items:
            type: string
        credits_charged:
          type: number
          minimum: 0
          description: Cumulative managed credits charged to this job, including native and AI when used.
        credits_remaining_estimate:
          type: number
          minimum: 0
        credit_charge_uncertain:
          type: boolean
        reused:
          type: boolean
        segment_count:
          type: integer
          minimum: 0
        transcript_characters:
          type: integer
          minimum: 0
        ai_fallback_requires_new_consent:
          type: boolean
        error:
          anyOf:
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
                retryable:
                  type: boolean
            - type: "null"
    SegmentPage:
      type: object
      required: [job_id, status, cursor, next_cursor, segments]
      properties:
        request_id:
          type: string
        job_id:
          type: string
          pattern: ^KRCM_[A-Za-z0-9-]+$
        status:
          type: string
          enum: [PROCESSING, COMPLETED, AWAITING_AI_CONSENT, FAILED]
        cursor:
          type: integer
        next_cursor:
          anyOf:
            - type: integer
            - type: "null"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
    Segment:
      type: object
      required: [index, start_ms, end_ms, text, confidence]
      properties:
        index:
          type: integer
        start_ms:
          anyOf:
            - type: integer
            - type: "null"
        end_ms:
          anyOf:
            - type: integer
            - type: "null"
        text:
          type: string
        confidence:
          anyOf:
            - type: number
            - type: "null"
security:
  - bearerAuth: []
